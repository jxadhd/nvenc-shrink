name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
    # Docs-only pushes don't need a test run. (Path filters never apply to tag pushes,
    # so releases always build. Use "Run workflow" to re-publish the website.)
    paths-ignore: ["**.md", "docs/**", "site-src/**", ".github/ISSUE_TEMPLATE/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "site-src/**", ".github/ISSUE_TEMPLATE/**"]
  workflow_dispatch:  # re-publish the apt repo / website without a new release

concurrency:
  # A newer push to the same branch cancels the older run; releases are never cancelled.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    # Debian 13 is what most users run, and deb.debian.org is far more reliable
    # than the runner's Ubuntu mirror (which has stalled for 20-40 min on apt).
    runs-on: ubuntu-24.04
    container: debian:trixie-slim
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Cache key for this week's Debian packages
        id: week
        run: echo "week=$(date +%G-%V)" >> "$GITHUB_OUTPUT"
      - name: Restore downloaded packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives/*.deb
          key: apt-trixie-ffmpeg-${{ steps.week.outputs.week }}
          restore-keys: apt-trixie-ffmpeg-
      - name: Install ffmpeg
        timeout-minutes: 8
        run: |
          rm -f /etc/apt/apt.conf.d/docker-clean   # keep .deb files so the cache can save them
          apt-get update -o Acquire::Retries=3
          apt-get install -y --no-install-recommends -o Acquire::Retries=3 ffmpeg python3
          ffmpeg -hide_banner -version | head -1
      - name: Run tests
        timeout-minutes: 10
        run: python3 -m unittest discover -s tests -v

  package:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build .deb
        run: python3 packaging/build_deb.py
      - name: Build wheel and sdist
        run: pipx run build --outdir dist
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        # Works whether the tag was pushed from git or created with the release form on GitHub.
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
              --title "nvenc-shrink $GITHUB_REF_NAME" --generate-notes
          fi

  apt-repo:
    # Adds the new .deb to the signed apt repository on GitHub Pages (gh-pages branch).
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: apt-repo
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: dist
      - name: Check the signing key is configured
        id: key
        run: |
          if [ -z "$APT_SIGNING_KEY" ]; then
            echo "::warning::APT_SIGNING_KEY secret not set, so the apt repository was not updated"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "$APT_SIGNING_KEY" | gpg --batch --import
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Check out the published site
        if: steps.key.outputs.ok == 'true'
        run: |
          url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}"
          if git ls-remote --exit-code --heads "$url" gh-pages >/dev/null; then
            git clone --depth 1 --branch gh-pages "$url" site
          else
            git init -b gh-pages site && git -C site remote add origin "$url"
          fi
      - name: Build and sign the repository
        if: steps.key.outputs.ok == 'true'
        run: |
          debs=""
          case "$GITHUB_REF" in refs/tags/v*) debs=$(ls dist/*.deb) ;; esac
          python3 packaging/build_apt_repo.py site $debs --key "$(cat packaging/apt/KEY_FINGERPRINT)"
          cp -r site-src/. site/
      - name: Publish
        if: steps.key.outputs.ok == 'true'
        run: |
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "nothing to publish"; exit 0; }
          git commit -q -m "Publish ${GITHUB_REF_NAME}"
          git push origin gh-pages
