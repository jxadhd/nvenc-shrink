# nvenc-shrink configuration
#
# Default arguments, exactly as you'd type them on the command line.
# Anything you pass on the command line overrides these.
# `--apply` is not allowed here, so a plain `nvenc-shrink` is always a dry run.
#
# 1. Your library folders (required). Quote paths that contain spaces.
#/srv/media/movies /srv/media/tv

# 2. Common options:
#--gpu 0              # pin NVENC to one GPU (see `nvidia-smi -L`)
#--cq 27              # quality; lower = better/bigger. Use --estimate to choose
#--max-read-mbps 8    # disk read cap per encode, MB/s (0 = no cap)
#--pause 30           # seconds between files
#--stop-at 07:00      # don't start new files after this time
#--encoder libx265    # force CPU encoding (default: NVENC if available)
